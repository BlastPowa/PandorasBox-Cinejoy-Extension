name: Release extension

on:
  push:
    branches: [main]
    paths:
      - manifest.json
      - background.js
      - content.js
      - icons/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version and check release
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync('manifest.json','utf8')).version")"
          if [[ -z "$VERSION" ]]; then
            echo "manifest.json has no version" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "is_new=false" >> "$GITHUB_OUTPUT"
            echo "Release v$VERSION already exists; nothing to publish."
          else
            echo "is_new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Package extension
        if: steps.meta.outputs.is_new == 'true'
        run: zip -r pbox-watch-sync.zip manifest.json background.js content.js icons

      - name: Create GitHub release
        if: steps.meta.outputs.is_new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.meta.outputs.version }}" \
            pbox-watch-sync.zip \
            --title "PBox Watch Sync v${{ steps.meta.outputs.version }}" \
            --generate-notes
